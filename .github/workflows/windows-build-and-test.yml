name: Build and test PRs on mysql-server repo

on:
  pull_request:
    branches:
      - trunk

jobs:
  windows-build:
     runs-on: windows-latest

     defaults:
       run:
         shell: powershell

     steps:
       - name: Enable long paths
         run: git config --system core.longpaths true

       - uses: actions/checkout@v6

       - name: Find OpenSSL root
         run: |
           $opensslExe = (Get-Command openssl).Source
           $opensslRoot = Split-Path (Split-Path $opensslExe -Parent) -Parent
           "OPENSSL_ROOT=$opensslRoot" | Out-File -FilePath $env:GITHUB_ENV -Append

       - name: Install Bison
         run: choco install winflexbison3 -y

       - name: Expose Bison as bison.exe
         run: |
           $winBison = (Get-Command win_bison -ErrorAction SilentlyContinue).Source
           if (-not $winBison) { throw "win_bison not found" }
           Copy-Item $winBison "C:\ProgramData\chocolatey\bin\bison.exe" -Force

       - name: Install Strawberry Perl
         run: choco install strawberryperl -y

       - name: Configure the Distribution
         run: |
           cmake -S . -B bld -G "Visual Studio 17 2022" -A x64 -DWITH_BOOST=C:\boost -DWITH_SSL="$env:OPENSSL_ROOT"

       - name: Build the Distribution
         run: |
           cmake --build bld -- /m

       - name: Run Tests
         run: |
            cd bld\mysql-test
            perl mysql-test-run.pl --vardir=$env:TEMP\mysql-var-dir --force --retry-failure=2 --retry=2 --max-test-fail=0 --report-unstable-tests --clean-vardir --xml-report="$env:GITHUB_WORKSPACE\mtr.xml" --summary-report="$env:GITHUB_WORKSPACE\mtr-86308.txt" 1st
