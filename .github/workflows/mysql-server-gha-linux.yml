name: Build and test PRs in mysql-server trunk branch on Oracle Linux

on:
  pull_request:
    branches: [ "trunk" ]

jobs:
  linux-build:
    runs-on: 
       - self-hosted
       - Linux
       - X64

    timeout-minutes: 360

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Environment
        run: |
          hostname
          whoami
          pwd
          uname -a
          nproc
          free -h
          df -h

      - name: Configure
        run: |
          set -euo pipefail
          rm -rf bld
          mkdir bld
          cd bld
          cmake ..

      - name: Build
        run: |
          set -euo pipefail
          cd bld
          make -j"$(nproc)"
