name: Build and test PRs in mysql-server trunk branch on Ubuntu

on:
  pull_request:
    branches: [ "trunk" ]
 
jobs:
  linux-workflow:
    runs-on: 
      - self-hosted
      - Linux
      - X64 
 
    steps:
      - name: Repository Checkout
        uses: actions/checkout@v6
        with: 
          fetch-depth: 0
            
      - name: File-Change Analysis
        id: diff
        shell: bash
        run: |
          set -euo pipefail
          
          base_sha='${{ github.event.pull_request.base.sha }}'
          head_sha='${{ github.event.pull_request.head.sha }}'
          
          mapfile -t changed_files < <(
            git diff --name-only "$base_sha" "$head_sha" | sed '/^$/d'
          )
          echo "Changed files detected in PR:"
          if (( ${#changed_files[@]} == 0 )); then
            echo "(none)"
          else
            printf '%s\n' "${changed_files[@]}"
          fi
          
          hypergraph_re='^(sql/join_optimizer.*|sql/iterators.*|sql/range_optimizer.*|sql/sql_.*|sql/query_.*|sql/opt_.*|sql/window.*|sql/item.*|sql/handler.*|sql/histogram/.*)'
          innodb_re='^(storage/innobase/|mysql-test/suite/innodb)'
          
          enable_hypergraph=true
          build_debug_tree=true
          enable_ndb=true
          enable_extra_mtr=true
  
          if (( ${#changed_files[@]} > 0 )); then
            if printf '%s\n' "${changed_files[@]}" | grep -Eq "$hypergraph_re"; then
              enable_hypergraph=true
            fi
            if printf '%s\n' "${changed_files[@]}" | grep -Eq "$innodb_re"; then
              build_debug_tree=true
            fi
            if printf '%s\n' "${changed_files[@]}" | grep -Eq '(innobase|innodb)'; then
              enable_extra_mtr=true
            fi
            if printf '%s\n' "${changed_files[@]}" | grep -Eq '^(storage/ndb/|sql/dd/ndbinfo_schema|mysql-test/suite/.*ndb.*)'; then
              enable_ndb=true
            fi
          fi
          
          {
            echo "enable_hypergraph=$enable_hypergraph"
            echo "build_debug_tree=$build_debug_tree"
            echo "enable_ndb=$enable_ndb"
            echo "enable_extra_mtr=$enable_extra_mtr"
          } >> "$GITHUB_OUTPUT"
          
      - name: Build
        shell: bash
        run: |
          set -euo pipefail
          
          build_opts=""
          if [[ "${{ steps.diff.outputs.enable_ndb }}" == "true" ]]; then
            build_opts="$build_opts -DWITH_NDBCLUSTER=1"
          fi
          if [[ "${{ steps.diff.outputs.enable_hypergraph }}" == "true" ]]; then
            build_opts="$build_opts -DWITH_HYPERGRAPH_OPTIMIZER=ON"
          fi
          
          rm -rf "${GITHUB_WORKSPACE}/bld" "${GITHUB_WORKSPACE}/debug"
          mkdir -p bld
          cd bld
          echo "cmake .. $build_opts"
          cmake .. $build_opts
          make -j"$(nproc)"
          
          if [[ "${{ steps.diff.outputs.build_debug_tree }}" == "true" ]]; then
            cd "${GITHUB_WORKSPACE}"
            mkdir -p debug
            cd debug
            debug_opts="-DWITH_DEBUG=1 -DOPTIMIZE_DEBUG_BUILDS=1 $build_opts"
            echo "cmake .. $debug_opts"
            cmake .. $debug_opts
            make -j"$(nproc)"
          fi
          
      - name: Package Generation
        shell: bash
        run: |
          set -euo pipefail
          
          cd bld
          make package
          
      - name: Main MTR Validation
        shell: bash
        continue-on-error: true
        run: |
          set +e
          set -o pipefail
          mysql_test_dir="${GITHUB_WORKSPACE}/bld/mysql-test"
          xml_report="${GITHUB_WORKSPACE}/mtr_${GITHUB_RUN_NUMBER}.xml"
          unit_report="${GITHUB_WORKSPACE}/mtr-unit_${GITHUB_RUN_NUMBER}.xml"
          summary_report="${GITHUB_WORKSPACE}/build-error_main_${GITHUB_RUN_NUMBER}.txt"
          
          if [ ! -d "${mysql_test_dir}" ]; then
            touch "${xml_report}"
            touch "${unit_report}"
            echo "skipped" > "${summary_report}"
            exit 0
          fi
          
          rm -rf /dev/shm/var_auto_*
          cd "${mysql_test_dir}"
          perl mysql-test-run.pl \
            --nounit-tests \
            --force \
            --mem \
            --retry-failure=2 \
            --retry=2 \
            --max-test-fail=0 \
            --report-unstable-tests \
            --clean-vardir \
            --parallel "$(nproc)" \
            --xml-report="${xml_report}" \
            --summary-report="${summary_report}"
            
          mtr_status=$?
          
          cd "${GITHUB_WORKSPACE}/bld"
          ctest -j "$(nproc)" --output-junit "${unit_report}"
          
          unit_status=$?
          
          exit $((mtr_status + unit_status))
          
      - name: Hypergraph Validation
        if: steps.diff.outputs.enable_hypergraph == 'true'
        shell: bash
        continue-on-error: true
        run: |
          set +e
          set -o pipefail
          mysql_test_dir="${GITHUB_WORKSPACE}/bld/mysql-test"
          hypergraph_report="${GITHUB_WORKSPACE}/hypergraph_${GITHUB_RUN_NUMBER}.txt"
          
          rm -rf /dev/shm/var_auto_* || true
          cd "${mysql_test_dir}"
          perl mysql-test-run.pl \
            --nounit-tests \
            --force \
            --mem \
            --retry-failure=2 \
            --retry=2 \
            --max-test-fail=0 \
            --report-unstable-tests \
            --clean-vardir \
            --parallel "$(nproc)" \
            --summary-report="${hypergraph_report}" \
            --hypergraph \
            --skip-ndb \
            --skip-suite=rapid
          
      - name: Additional InnoDB Validation
        if: steps.diff.outputs.enable_extra_mtr == 'true'
        shell: bash
        continue-on-error: true
        run: |
          set +e
          set -o pipefail
          mysql_test_dir="${GITHUB_WORKSPACE}/bld/mysql-test"
          extra_report="${GITHUB_WORKSPACE}/extra_suites_${GITHUB_RUN_NUMBER}.txt"
          extra_suites=(innodb_fts innodb_undo innodb_gis innodb_zip)
          
          rm -rf /dev/shm/var_auto_* || true
          cd "${mysql_test_dir}"
          perl mysql-test-run.pl \
            --force \
            --mem \
            --retry-failure=2 \
            --retry=2 \
            --max-test-fail=0 \
            --report-unstable-tests \
            --clean-vardir \
            --parallel "$(nproc)" \
            --summary-report="${extra_report}" \
            --suite="$(IFS=,; echo "${extra_suites[*]}")"
      
      - name: Debug Validation
        if: steps.diff.outputs.build_debug_tree == 'true'
        shell: bash
        continue-on-error: true
        run: |
          set +e
          set -o pipefail
          
          debug_test_dir="${GITHUB_WORKSPACE}/debug/mysql-test"
          debug_xml_report="${GITHUB_WORKSPACE}/mtr-debug_${GITHUB_RUN_NUMBER}.xml"
          debug_summary_report="${GITHUB_WORKSPACE}/build-error_debug_${GITHUB_RUN_NUMBER}.txt"
          debug_err_log="${GITHUB_WORKSPACE}/mtr_${GITHUB_RUN_NUMBER}.err"
          
          rm -rf /dev/shm/var_auto_*
          cd "${debug_test_dir}"
          perl mysql-test-run.pl \
            --force \
            --mem \
            --retry-failure=2 \
            --retry=2 \
            --max-test-fail=0 \
            --report-unstable-tests \
            --clean-vardir \
            --xml-report="${debug_xml_report}" \
            --summary-report="${debug_summary_report}" \
            --parallel "$(nproc)" \
            2>&1 | tee "${debug_err_log}"
            
      - name: Replication Validation
        shell: bash
        continue-on-error: true
        run: |
          set +e
          set -o pipefail
          mysql_test_dir="${GITHUB_WORKSPACE}/bld/mysql-test"
          repl_report="${GITHUB_WORKSPACE}/mtr-replication_${GITHUB_RUN_NUMBER}.xml"
          repl_summary="${GITHUB_WORKSPACE}/build-error_replication_${GITHUB_RUN_NUMBER}.txt"
          
          rm -rf /dev/shm/var_auto_* || true
          cd "${mysql_test_dir}"
          perl mysql-test-run.pl \
            --force \
            --mem \
            --retry-failure=2 \
            --retry=2 \
            --max-test-fail=0 \
            --report-unstable-tests \
            --clean-vardir \
            --xml-report="${repl_report}" \
            --summary-report="${repl_summary}" \
            --parallel "$(nproc)" \
            --comment=group_replication \
            --suite=group_replication
            
      - name: XML Validation
        shell: bash
        run: |
          set -euo pipefail
          
          cd "${GITHUB_WORKSPACE}"
          find . -name 'mtr_*.xml' -size 0 -delete
          for f in mtr_*.xml; do
            [ -e "$f" ] || continue
            xmllint --noout "$f"
          done
          
      - name: Publish MTR Summary
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          emit_mtr_stage() {
            local title="$1"
            local enabled="$2"
            local report="$3"
            local log="${4:-}"
            local content status total failed unstable line
            if [[ "$enabled" != "true" ]]; then
              echo "- ${title}: Skipped"
              echo "   Not enabled for this PR"
              echo
              return
            fi
            if [[ ! -f "$report" ]]; then
              echo "X ${title}: Failed"
              echo "   No summary report produced"
              echo
              return
            fi
            content="$(cat "$report")"
            if grep -qi '^skipped$' <<<"$content"; then
              echo "- ${title}: Skipped"
              echo "   Report says skipped"
              echo
              return
            fi
            status="Failed"
            total=""
            failed=""
            if [[ "$content" =~ Completed:[[:space:]]*All[[:space:]]*([0-9]+)[[:space:]]*tests[[:space:]]*were[[:space:]]*successful\. ]]; then
              total="${BASH_REMATCH[1]}"
              failed="0"
              status="Completed"
            elif [[ "$content" =~ Failed[[:space:]]*([0-9]+)/([0-9]+)[[:space:]]*tests ]]; then
              failed="${BASH_REMATCH[1]}"
              total="${BASH_REMATCH[2]}"
              status="Completed"
            elif [[ -n "$log" && -f "$log" ]]; then
              line="$(grep -Eo 'Failed[[:space:]]*[0-9]+/[0-9]+[[:space:]]*tests' "$log" | tail -n 1 || true)"
              if [[ "$line" =~ Failed[[:space:]]*([0-9]+)/([0-9]+)[[:space:]]*tests ]]; then
                failed="${BASH_REMATCH[1]}"
                total="${BASH_REMATCH[2]}"
                status="Completed"
              fi
            fi
            
            if [[ "$status" == "Completed" ]]; then
              echo "* ${title}: Completed"
            else
              echo "X ${title}: Failed"
            fi
            [[ -n "$total" ]] && echo "   No of tests: ${total}"
            [[ -n "$failed" ]] && echo "   Failed: ${failed}"
            echo
          }
          emit_unit_stage() {
            local title="$1"
            local xml="$2"
            if [[ ! -f "$xml" ]]; then
              echo "X ${title}: Failed"
              echo "   No unit-test report produced"
              echo
              return
            fi
            if [[ ! -s "$xml" ]]; then
              echo "X ${title}: Failed"
              echo "   Empty unit-test report"
              echo
              return
            fi
            local tests failures skipped
            tests="$(xmllint --xpath 'string(//testsuites/@tests | //testsuite/@tests)' "$xml" 2>/dev/null || true)"
            failures="$(xmllint --xpath 'string(//testsuites/@failures | //testsuite/@failures)' "$xml" 2>/dev/null || true)"
                
            tests="${tests:-0}"
            failures="${failures:-0}"
         
            echo "* ${title}: Completed"
            echo "   No of tests: ${tests}"
            echo "   Failed: ${failures}"
            echo
          }
          {
            echo "## Linux Test Summary"
            echo
            emit_mtr_stage "Main MTR" "true" "${GITHUB_WORKSPACE}/build-error_main_${GITHUB_RUN_NUMBER}.txt"
            emit_unit_stage "Unit tests" "${GITHUB_WORKSPACE}/mtr-unit_${GITHUB_RUN_NUMBER}.xml"
            emit_mtr_stage "Hypergraph MTR" "${{ steps.diff.outputs.enable_hypergraph }}" "${GITHUB_WORKSPACE}/hypergraph_${GITHUB_RUN_NUMBER}.txt"
            emit_mtr_stage "Additional InnoDB MTR" "${{ steps.diff.outputs.enable_extra_mtr }}" "${GITHUB_WORKSPACE}/extra_suites_${GITHUB_RUN_NUMBER}.txt"
            emit_mtr_stage "Debug MTR" "${{ steps.diff.outputs.build_debug_tree }}" "${GITHUB_WORKSPACE}/build-error_debug_${GITHUB_RUN_NUMBER}.txt" "${GITHUB_WORKSPACE}/mtr_${GITHUB_RUN_NUMBER}.err"
            emit_mtr_stage "Replication MTR" "true" "${GITHUB_WORKSPACE}/build-error_replication_${GITHUB_RUN_NUMBER}.txt"
           } >> "$GITHUB_STEP_SUMMARY"
    
      - name: Artifact Organization
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          
          rm -rf artifacts
          mkdir -p \
            artifacts/test-reports \
            artifacts/summaries \
            artifacts/logs \
            artifacts/packages
    
          shopt -s nullglob

          # Test reports
          cp -v mtr_*.xml artifacts/test-reports/ 2>/dev/null || true
          cp -v mtr-unit_*.xml artifacts/test-reports/ 2>/dev/null || true

          # Summaries
          cp -v build-error_main_*.txt artifacts/summaries/ 2>/dev/null || true
          cp -v build-error_debug_*.txt artifacts/summaries/ 2>/dev/null || true
          cp -v build-error_replication_*.txt artifacts/summaries/ 2>/dev/null || true
          cp -v extra_suites_*.txt artifacts/summaries/ 2>/dev/null || true
          cp -v hypergraph_*.txt artifacts/summaries/ 2>/dev/null || true

          # Logs
          cp -v mtr_*.err artifacts/logs/ 2>/dev/null || true

          # Packages
          find bld -type f \( -name '*.tar.gz' -o -name '*.tgz' -o -name '*.zip' \) \
            -exec cp -v {} artifacts/packages/ \; 2>/dev/null || true
          
      - name: Artifact Upload
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mysql-ci-artifacts
          if-no-files-found: ignore
          path: artifacts/   
