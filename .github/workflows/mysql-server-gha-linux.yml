name: Build and test PRs in mysql-server trunk branch on Oracle Linux

on:
  pull_request:
    branches: [ "trunk" ] 
 
jobs:  
  linux-build:
    runs-on: 
       - self-hosted
       - Linux
       - X64

    timeout-minutes: 360

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Analyze changed files
        id: diff
        shell: bash
        run: |
          set -euo pipefail

          base_sha='${{ github.event.pull_request.base.sha }}'
          head_sha='${{ github.event.pull_request.head.sha }}'
          base_branch='${{ github.base_ref }}'

          mapfile -t changed_files < <(
            git diff --name-only "$base_sha" "$head_sha" | sed '/^$/d'
          )

          doxygen_skip_re='^(internal/cloud/(rapid/.*|mysql-test/suite/rapid.*|mysql-test/[^/]*$|components/vector_store_load/.*))$'
          hypergraph_re='(hypergraph|sql/join_optimizer.*|sql/iterators.*|sql/range_optimizer.*|sql/sql_.*|sql/query_.*|sql/opt_.*|sql/window.*|sql/item.*|sql/handler.*|sql/histogram/.*)'
          innodb_re='^(storage/innobase/|mysql-test/suite/innodb)'

          skip_doxygen=false
          enable_hypergraph=false
          build_debug_tree=false
          enable_rapid=false
          enable_router=false
          enable_ndb=false
          enable_airglow=false
          enable_mle=false
          enable_extra_mtr=false
          extra_mtr_mysql_test_dir="bld/mysql-test"

          if (( ${#changed_files[@]} > 0 )); then
            if printf '%s\n' "${changed_files[@]}" | grep -Eqv "$doxygen_skip_re"; then
              skip_doxygen=false
            else
              skip_doxygen=true
            fi

            if printf '%s\n' "${changed_files[@]}" | grep -Eq "$hypergraph_re"; then
              enable_hypergraph=true
            fi

            if printf '%s\n' "${changed_files[@]}" | grep -Eq "$innodb_re"; then
              build_debug_tree=true
            fi

            if printf '%s\n' "${changed_files[@]}" | grep -Eq '^internal/cloud/rapid/'; then
              enable_rapid=true
            fi

            if printf '%s\n' "${changed_files[@]}" | grep -Eq '^router/'; then
              enable_router=true
            fi

            if printf '%s\n' "${changed_files[@]}" | grep -Eq '^(storage/ndb/|sql/dd/ndbinfo|mysql-test/suite/.*ndb)'; then
              enable_ndb=true
            fi

            if printf '%s\n' "${changed_files[@]}" | grep -Eq '(innobase|innodb)'; then
              enable_extra_mtr=true
              extra_mtr_mysql_test_dir="debug/mysql-test"
            fi
          fi

          if [[ "$base_branch" == "trunk" || "$base_branch" == "mysql-trunk" ]]; then
            enable_rapid=true
          fi

          [[ -d internal/cloud/plugin/airglow ]] && enable_airglow=true
          [[ -d internal/components/mle ]] && enable_mle=true

          {
            echo "skip_doxygen=$skip_doxygen"
            echo "enable_hypergraph=$enable_hypergraph"
            echo "build_debug_tree=$build_debug_tree"
            echo "enable_rapid=$enable_rapid"
            echo "enable_router=$enable_router"
            echo "enable_ndb=$enable_ndb"
            echo "enable_airglow=$enable_airglow"
            echo "enable_mle=$enable_mle"
            echo "enable_extra_mtr=$enable_extra_mtr"
            echo "extra_mtr_mysql_test_dir=$extra_mtr_mysql_test_dir"
          } >> "$GITHUB_OUTPUT"          

      - name: Doxygen
        if: steps.diff.outputs.skip_doxygen != 'true'
        shell: bash
        run: |
          set -euo pipefail

          rm -rf build-doxygen
          mkdir -p build-doxygen
          cd build-doxygen

          cmake ..
          make doxygen
          
      - name: Build
        shell: bash
        run: |
          set -euo pipefail

          BUILD_OPTS=""

          if [[ "${{ steps.diff.outputs.enable_rapid }}" == "true" ]]; then
            BUILD_OPTS="$BUILD_OPTS -DWITH_RAPID=1"
          fi

          if [[ "${{ steps.diff.outputs.enable_router }}" == "true" ]]; then
            BUILD_OPTS="$BUILD_OPTS -DWITH_ROUTER=1"
          else
            BUILD_OPTS="$BUILD_OPTS -DWITH_ROUTER=0"
          fi

          if [[ "${{ steps.diff.outputs.enable_ndb }}" == "true" ]]; then
            BUILD_OPTS="$BUILD_OPTS -DWITH_NDBCLUSTER=1"
          fi

          if [[ "${{ steps.diff.outputs.enable_hypergraph }}" == "true" ]]; then
            BUILD_OPTS="$BUILD_OPTS -DWITH_HYPERGRAPH_OPTIMIZER=ON"
          fi

          if [[ "${{ steps.diff.outputs.enable_airglow }}" == "true" ]]; then
            BUILD_OPTS="$BUILD_OPTS -DWITH_AIRGLOW=1 -DWITH_LOGSVC=0"
          fi

          if [[ "${{ steps.diff.outputs.enable_mle }}" == "true" ]]; then
            BUILD_OPTS="$BUILD_OPTS -DWITH_MLE=1"
          fi

          export PATH=/usr/lib/ccache:$PATH
          export WITH_GMOCK=/usr/global/share
          export WITH_BOOST=/usr/global/share

          rm -rf "${GITHUB_WORKSPACE}/bld" "${GITHUB_WORKSPACE}/debug"
          mkdir -p bld
          cd bld

          echo "cmake .. $BUILD_OPTS"
          cmake .. $BUILD_OPTS
          make -j"$(nproc)"

          if [[ "${{ steps.diff.outputs.build_debug_tree }}" == "true" ]]; then
            cd "${GITHUB_WORKSPACE}"
            mkdir -p debug
            cd debug

            DEBUG_OPTS="-DWITH_DEBUG=1 -DOPTIMIZE_DEBUG_BUILDS=1 $BUILD_OPTS"
            echo "cmake .. $DEBUG_OPTS"
            cmake .. $DEBUG_OPTS
            make -j"$(nproc)"
          fi
          
      - name: Create package
        shell: bash
        run: |
          set -euo pipefail

          cd bld
          make package

      - name: MTR
        shell: bash
        continue-on-error: true
        run: |
          set -euo pipefail

          export XML_REPORT="${GITHUB_WORKSPACE}/mtr-${GITHUB_RUN_NUMBER}.xml"
          export UNIT_REPORT="${GITHUB_WORKSPACE}/mtr-unit-${GITHUB_RUN_NUMBER}.xml"
          export SUMMARY_REPORT="${GITHUB_WORKSPACE}/build-error_${GITHUB_RUN_NUMBER}.txt"
          export MYSQL_TEST_DIR="${GITHUB_WORKSPACE}/bld/mysql-test"

          if [ ! -d "${MYSQL_TEST_DIR}" ]; then
            touch "${XML_REPORT}"
            touch "${UNIT_REPORT}"
            echo "skipped" > "${SUMMARY_REPORT}"
            exit 0
          fi

          rm -rf /dev/shm/var_auto_* || true

          cd "${MYSQL_TEST_DIR}"
          perl mysql-test-run.pl \
            --nounit-tests \
            --force \
            --mem \
            --retry-failure=2 \
            --retry=2 \
            --max-test-fail=0 \
            --report-unstable-tests \
            --clean-vardir \
            --parallel "$(nproc)" \
            --xml-report="${XML_REPORT}" \
            --summary-report="${SUMMARY_REPORT}"

          cd "${GITHUB_WORKSPACE}/bld"
          ctest -j "$(nproc)" --output-junit "${UNIT_REPORT}"

      - name: Hypergraph MTR
        if: steps.diff.outputs.enable_hypergraph == 'true'
        shell: bash
        continue-on-error: true
        run: |
          set -euo pipefail

          export HYPERGRAPH_REPORT="${GITHUB_WORKSPACE}/hypergraph_${GITHUB_RUN_NUMBER}.txt"
          export MYSQL_TEST_DIR="${GITHUB_WORKSPACE}/bld/mysql-test"

          rm -rf /dev/shm/var_auto_* || true

          cd "${MYSQL_TEST_DIR}"
          perl mysql-test-run.pl \
            --nounit-tests \
            --force \
            --mem \
            --retry-failure=2 \
            --retry=2 \
            --max-test-fail=0 \
            --report-unstable-tests \
            --clean-vardir \
            --parallel "$(nproc)" \
            --summary-report="${HYPERGRAPH_REPORT}" \
            --hypergraph \
            --skip-ndb \
            --skip-suite=rapid    

      - name: Extra MTR suites
        if: steps.diff.outputs.enable_extra_mtr == 'true'
        shell: bash
        continue-on-error: true
        run: |
          set -euo pipefail

          extra_report="${GITHUB_WORKSPACE}/extra_suites_${GITHUB_RUN_NUMBER}.txt"
          mysql_test_dir="${GITHUB_WORKSPACE}/${{ steps.diff.outputs.extra_mtr_mysql_test_dir }}"
          extra_suites=(meb meb_ddl innodb_fts innodb_undo innodb_gis innodb_zip)

          rm -rf /dev/shm/var_auto_* || true

          cd "${mysql_test_dir}"
          perl mysql-test-run.pl \
            --nounit-tests \
            --force \
            --mem \
            --retry-failure=2 \
            --retry=2 \
            --max-test-fail=0 \
            --report-unstable-tests \
            --clean-vardir \
            --parallel "$(nproc)" \
            --summary-report="${extra_report}" \
            --suite="$(IFS=,; echo "${extra_suites[*]}")"
            
      - name: Debug
        shell: bash
        continue-on-error: true
        run: |
          set -euo pipefail

          DEBUG_TEST_DIR="${GITHUB_WORKSPACE}/debug/mysql-test"
          DEBUG_XML_REPORT="${GITHUB_WORKSPACE}/mtr-debug.xml"
          DEBUG_SUMMARY_REPORT="${GITHUB_WORKSPACE}/build-error_debug_${GITHUB_RUN_NUMBER}.txt"
          DEBUG_ERR_LOG="${GITHUB_WORKSPACE}/mtr.err"

          if [ ! -d "${DEBUG_TEST_DIR}" ]; then
            touch "${DEBUG_XML_REPORT}"
            echo "skipped" > "${DEBUG_SUMMARY_REPORT}"
            exit 0
          fi

          rm -rf /dev/shm/var_auto_* || true

          cd "${DEBUG_TEST_DIR}"
          perl mysql-test-run.pl \
            --force \
            --mem \
            --retry-failure=2 \
            --retry=2 \
            --max-test-fail=0 \
            --report-unstable-tests \
            --clean-vardir \
            --xml-report="${DEBUG_XML_REPORT}" \
            --summary-report="${DEBUG_SUMMARY_REPORT}" \
            --parallel "$(nproc)" \
            2>&1 | tee "${DEBUG_ERR_LOG}"
            
      - name: MTR Replication Testing
        shell: bash
        continue-on-error: true
        run: |
          set -euo pipefail

          export REPL_REPORT="${GITHUB_WORKSPACE}/mtr-replication.xml"
          export REPL_SUMMARY="${GITHUB_WORKSPACE}/build-error_replication_${GITHUB_RUN_NUMBER}.txt"

          rm -rf /dev/shm/var_auto_* || true

          cd "${GITHUB_WORKSPACE}/bld/mysql-test"
          perl mysql-test-run.pl \
            --force \
            --mem \
            --retry-failure=2 \
            --retry=2 \
            --max-test-fail=0 \
            --report-unstable-tests \
            --clean-vardir \
            --xml-report="${REPL_REPORT}" \
            --summary-report="${REPL_SUMMARY}" \
            --parallel "$(nproc)" \
            --comment=group_replication \
            --suite=group_replication

      - name: xmllint
        shell: bash
        run: |
          set -euo pipefail

          for f in \
            "${GITHUB_WORKSPACE}"/mtr-*.xml \
            "${GITHUB_WORKSPACE}"/mtr-unit-*.xml \
            "${GITHUB_WORKSPACE}"/mtr-replication.xml
          do
            [ -e "$f" ] || continue
            xmllint --noout "$f"
          done

            
