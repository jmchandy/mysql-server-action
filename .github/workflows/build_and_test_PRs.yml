#Build and run basic tests on pull requests 
name: Build and test PRs on mysql-server repo

#Trigger workflow on pull requests to trunk branch of repo
on:
  pull_request:
    branches: [ "trunk" ]

jobs:
#Build on ubuntu
  ubuntu-build:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v6

    - name: Install Dependencies 
      run: |
        sudo apt-get update
        sudo apt-get install -y cmake make gcc g++ perl bison libtirpc-dev libssl-dev libncurses-dev

    - name: Configure the Distribution
      run: |
        mkdir build
        cd build
        cmake ..

    - name: Build the Distribution
      working-directory: build
      run: make

    - name: Run Tests
      working-directory: build/mysql-test
      run: ./mysql-test-run.pl --do-suite=main --force --timer
         
#Build on windows
  windows-build:
    runs-on: windows-latest

    steps:
        - uses: actions/checkout@v6

        - name: Install Bison
          shell: pwsh
          run: |
            choco install winflexbison3 -y

        - name: Add Bison to PATH
          shell: pwsh
          run: |
            echo "C:\ProgramData\chocolatey\lib\winflexbison3\tools" >> $env:GITHUB_PATH
            
        - name: Find OpenSSL root
          shell: pwsh
          run: |
            $opensslExe = (Get-Command openssl).Source
            $opensslRoot = Split-Path (Split-Path $opensslExe -Parent) -Parent
            echo "OPENSSL_ROOT=$opensslRoot" >> $env:GITHUB_ENV
            Write-Host "OpenSSL root: $opensslRoot"
        
        - name: Configure the Distribution
          shell: pwsh
          run: |
            if (Test-Path build) { Remove-Item -Recurse -Force build }
            cmake -S . -B build -G "Visual Studio 17 2022" -A x64 -DWITH_SSL="$env:OPENSSL_ROOT"

        - name: Build the Distribution
          working-directory: build
          run: |
            devenv MySQL.sln /build RelWithDebInfo

        - name: Run Tests
          working-directory: build/mysql-test
          run: |
            .\mysql-test-run.pl --force --timer --vs-config=RelWithDebInfo
